appId: com.dentivapro.desktop
productName: Dentiva Pro
copyright: 'Copyright (c) 2026 Shohan Khan. All rights reserved.'

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.{map,md,ts,tsx}'
  - '!node_modules/**/{test,tests,__tests__,doc,docs,example,examples}/**'

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

extraResources:
  # The user guide and the licence notices that the About page opens. The application icon lives in the
  # executable (build/icon.*) and the in-app brand mark is bundled by the renderer build, so neither is
  # copied here.
  - from: docs/user-guide
    to: user-guide
    filter: ['USER_GUIDE.html']
  - from: docs/compliance
    to: legal
    filter: ['THIRD-PARTY-NOTICES.txt']

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: DentivaPro-Setup-${version}-${arch}.${ext}
  legalTrademarks: Dentiva Pro
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dentiva Pro
  menuCategory: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  differentialPackage: false

portable:
  artifactName: DentivaPro-Portable-${version}-${arch}.${ext}

linux:
  target:
    - dir
  category: Office
  icon: build/icons
