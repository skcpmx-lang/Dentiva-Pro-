name: Release (Windows installer)

# Produces the real Windows application: NSIS installer, unpacked application, checksums and build
# information. Runs on a version tag (v1.0.0) or on demand. The release is only created after the
# artifact has been verified by the same script the release checklist uses, and it is created as a
# draft unless a manual run explicitly asks for a published release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows-package:
    name: Build, verify and publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    # windows-latest defaults to PowerShell, where the POSIX guards below ([ -z ... ], ${VAR})
    # are not valid. Every script step in this job is bash, which also makes the release behave the
    # same as the CI jobs an operator has already seen pass.
    defaults:
      run:
        shell: bash
    env:
      DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the version in package.json matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi
          echo "Version $PACKAGE_VERSION matches the tag."

      - name: Lint and type check
        run: |
          npm run lint
          npm run typecheck

      - name: Require the activation code for the suite
        env:
          DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}
        run: |
          if [ -z "$DENTIVA_ACTIVATION_CODE" ]; then
            echo "::error::This job needs the DENTIVA_ACTIVATION_CODE repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). The activation verifier uses a fixed offline secret, so the suite cannot be faked; without the secret every activation-dependent test would be skipped and the result would prove nothing."
            exit 1
          fi

      - name: Tests
        run: |
          npm run test:unit
          npm run test:integration

      - name: Regenerate the third-party notices and fail when they are stale
        run: |
          npm run licenses
          git diff --exit-code docs/compliance/

      - name: Pre-release audits (master prompt §113) and tracing check
        run: |
          node scripts/generate-traceability-matrix.mjs --check
          npm run audit:prerelease -- --report pre-release-audit.md

      - name: Build and package the NSIS installer
        run: npm run package:win
        env:
          DENTIVA_BUILD_NUMBER: ${{ github.run_number }}

      - name: Verify the artifact (header, size, checksums, unpacked resources)
        run: npm run verify:installer

      - name: Upload the installer and checksums
        uses: actions/upload-artifact@v5
        with:
          name: DentivaPro-Setup-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/SHA256SUMS.txt
            release/build-info.json
          retention-days: 90

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}"; fi
          TITLE="Dentiva Pro $VERSION"
          NOTES="Windows installer for Dentiva Pro $VERSION. See release/build-info.json for the commit and build date, and release/SHA256SUMS.txt for checksums."
          FILES="release/DentivaPro-Setup-${VERSION}-x64.exe release/SHA256SUMS.txt release/build-info.json"
          # Drafts are the default for every path: only a manual run that explicitly asks for
          # draft=false publishes the release straight away. A mistaken tag push can therefore never
          # publish a build that a human has not looked at.
          DRAFT="true"
          if [ "${INPUT_DRAFT}" = "false" ]; then
            DRAFT="false"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          elif [ "$DRAFT" = "true" ]; then
            gh release create "$TAG" $FILES --title "$TITLE" --notes "$NOTES" --draft
          else
            gh release create "$TAG" $FILES --title "$TITLE" --notes "$NOTES"
          fi
        continue-on-error: false
