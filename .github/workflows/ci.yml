name: CI

# Continuous integration for the Windows desktop product. Linux runners cover the fast checks
# (lint, types, unit and integration tests, production build); the Electron end-to-end suite runs on
# windows-latest, because that is the platform the application ships for.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set this repository secret to the activation code so the setup/activation integration tests run.
  # Without it those tests are skipped, and the rest of the suite still runs.
  DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (main process)
        run: npm run typecheck:node

      - name: Type check (renderer)
        run: npm run typecheck:web

      - name: Unit tests
        run: npm run test:unit

      - name: Build the application bundles
        run: npm run build:app

      - name: Check the build produced the expected output
        run: |
          test -f out/main/index.js
          test -f out/preload/index.js
          test -f out/renderer/index.html
          echo "main/preload/renderer bundles present"

      - name: Upload the build output
        uses: actions/upload-artifact@v5
        with:
          name: dentiva-build-${{ github.sha }}
          path: out/
          retention-days: 14

  integration:
    name: Integration tests over the real service layer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the activation code for the suite
        env:
          DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}
        run: |
          if [ -z "$DENTIVA_ACTIVATION_CODE" ]; then
            echo "::error::This job needs the DENTIVA_ACTIVATION_CODE repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). The activation verifier uses a fixed offline secret, so the suite cannot be faked; without the secret every activation-dependent test would be skipped and the result would prove nothing."
            exit 1
          fi

      - name: Integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: dentiva-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14

  # The product ships for Windows, and the release workflow builds on windows-latest — the fast suites
  # must therefore pass there too, not only on the ubuntu integration job. Failures are published as
  # annotations because the runner log archive is not always reachable (see the e2e-windows job).
  windows-tests:
    name: Unit + integration tests on windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the activation code for the suite
        shell: bash
        env:
          DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}
        run: |
          if [ -z "$DENTIVA_ACTIVATION_CODE" ]; then
            echo "::error::This job needs the DENTIVA_ACTIVATION_CODE repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). The activation verifier uses a fixed offline secret, so the suite cannot be faked; without the secret every activation-dependent test would be skipped and the result would prove nothing."
            exit 1
          fi

      - name: Tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          exit_code=0
          npm run test:unit 2>&1 | tee tests-unit.txt || exit_code=1
          npm run test:integration 2>&1 | tee tests-integration.txt || exit_code=1
          if [ "$exit_code" -ne 0 ]; then
            echo "A test suite failed; the reason is published as an annotation below."
          fi
          exit "$exit_code"

      - name: Publish the test failure as an annotation
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          [ -s tests-unit.txt ] && node scripts/ci-annotate.mjs tests-unit.txt "Windows unit suite failed"
          [ -s tests-integration.txt ] && node scripts/ci-annotate.mjs tests-integration.txt "Windows integration suite failed"
          exit 1

  maintenance-tools:
    name: Maintenance tools (audit, notices, backup verifier, stress run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency and licence audit
        run: npm run audit:deps

      - name: Regenerate the third-party notices and confirm they are current
        run: |
          npm run licenses
          git diff --exit-code docs/compliance/THIRD-PARTY-NOTICES.md docs/compliance/THIRD-PARTY-NOTICES.txt

      - name: Confirm the requirements traceability matrix is current
        run: node scripts/generate-traceability-matrix.mjs --check

      - name: Pre-release audits (master prompt §113)
        run: npm run audit:prerelease -- --report "$RUNNER_TEMP/pre-release-audit.md"

      - name: Keep the pre-release audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pre-release-audit
          path: ${{ runner.temp }}/pre-release-audit.md
          if-no-files-found: warn

      - name: Performance run on a reduced dataset (budgets must hold)
        run: node scripts/seed-stress-data.mjs --scale 0.1 --root "$RUNNER_TEMP/stress" --no-report

  e2e-windows:
    name: End-to-end (Electron, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the activation code for the suite
        shell: bash
        env:
          DENTIVA_ACTIVATION_CODE: ${{ secrets.DENTIVA_ACTIVATION_CODE }}
        run: |
          if [ -z "$DENTIVA_ACTIVATION_CODE" ]; then
            echo "::error::This job needs the DENTIVA_ACTIVATION_CODE repository secret (Settings -> Secrets and variables -> Actions -> New repository secret). The activation verifier uses a fixed offline secret, so the suite cannot be faked; without the secret every activation-dependent test would be skipped and the result would prove nothing."
            exit 1
          fi

      - name: Build the application
        run: npm run build:app

      - name: End-to-end acceptance tests
        id: e2e
        continue-on-error: true
        shell: bash
        run: npm run test:e2e 2>&1 | tee e2e-output.txt

      # A Windows job that fails is only useful if the reason survives: the runner log archive is not always
      # reachable, so the tail of the output is published as an annotation, which is part of the REST API.
      - name: Publish the end-to-end failure as an annotation
        if: steps.e2e.outcome == 'failure'
        shell: bash
        run: |
          node scripts/ci-annotate.mjs e2e-output.txt "End-to-end suite failed" test-results/e2e-results.json
          exit 1

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dentiva-e2e-results
          path: |
            test-results/
          retention-days: 14
